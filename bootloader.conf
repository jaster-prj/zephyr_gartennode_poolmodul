# Gartennode has a 192 KiB external secondary slot and a separate scratch area.
CONFIG_BOOT_SWAP_USING_SCRATCH=y
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="gartennode.pem"
CONFIG_BOOT_VALIDATE_SLOT0=y
# Preserve the existing bootloader policy; the application's watchdog is separate.
CONFIG_WATCHDOG=n
